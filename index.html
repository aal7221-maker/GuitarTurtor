<style>
  :root {
    --ytpanel-bottom: 150px;
    --bg: #14161b; --panel: rgba(24, 27, 34, 0.88); --text: #e9ecf1; --muted: #9aa3b2;
    --accent: #ffb347; --border: rgba(255, 255, 255, 0.12); --btn: #2a2f3a; --btn-hover: #353b48;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --panel: rgba(250, 250, 252, 0.92); --text: #1b1f27; --muted: #5b6474;
      --border: rgba(0, 0, 0, 0.12); --btn: #e7e9ee; --btn-hover: #dcdfe6; --accent: #c76a00;
    }
  }
  :root[data-theme="dark"] { --panel: rgba(24, 27, 34, 0.88); --text: #e9ecf1; --muted: #9aa3b2; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .bar { position: fixed; left: 0; right: 0; padding: 8px 16px; display: flex; flex-wrap: wrap; gap: 8px;
    align-items: center; background: var(--panel); border-color: var(--border); backdrop-filter: blur(6px); z-index: 4; }
  #top { top: 0; border-bottom: 1px solid var(--border); }
  #bottom { bottom: 0; border-top: 1px solid var(--border); padding-bottom: max(8px, env(safe-area-inset-bottom)); }
  h1 { font-size: 15px; margin: 0 8px 0 0; font-weight: 650; letter-spacing: 0.01em; }
  button, select { font: inherit; color: var(--text); background: var(--btn); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 12px; min-height: 36px; cursor: pointer; }
  button:hover, select:hover { background: var(--btn-hover); }
  button[aria-pressed="true"] { border-color: var(--accent); }
  #song { flex: 0 1 auto; min-width: 0; max-width: 100%; }
  #play { min-width: 76px; font-weight: 600; border-color: var(--accent); }
  #scrub { flex: 1 1 160px; accent-color: var(--accent); min-width: 120px; }
  #time { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 84px; text-align: right; }
  .more { position: relative; margin-left: auto; }
  #more-menu { position: absolute; right: 0; top: calc(100% + 6px); min-width: 230px; max-width: calc(100vw - 32px); display: flex; flex-direction: column; gap: 6px;
    padding: 10px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; backdrop-filter: blur(8px); z-index: 6; box-shadow: 0 8px 24px rgba(0,0,0,0.35); }
  #more-menu[hidden] { display: none; }
  #more-menu > a, #more-menu > button, #more-menu > label { text-align: left; }
  .linkbtn, label.file { color: var(--text); background: var(--btn); border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; min-height: 36px;
    display: flex; align-items: center; text-decoration: none; cursor: pointer; }
  .linkbtn:hover, label.file:hover { background: var(--btn-hover); }
  label.file:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
  #status { color: var(--muted); font-size: 12px; line-height: 1.35; border-top: 1px solid var(--border); padding-top: 6px; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12px; color: var(--muted); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }
  #loading { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); color: var(--muted); }
  @media (max-width: 600px) {
    .bar { padding: 6px 10px; gap: 6px; }
    h1 { display: none; }
    #song { flex: 1 1 0; }
    #scrub { flex: 1 1 100%; order: -1; }
    #time { min-width: 0; }
    button, select { padding: 6px 9px; }
  }
</style>

<body>
<div id="stage"></div>
<div id="loading">Loading hand model…</div>
<div class="bar" id="top">
  <h1>Guitar Hand 3D</h1>
  <select id="song" aria-label="Song"></select>
  <div class="more">
    <button id="more" aria-haspopup="true" aria-expanded="false" aria-controls="more-menu">More ▾</button>
    <div id="more-menu" hidden>
      <a id="tabslink" class="linkbtn" href="tabs.html">Tab view</a>
      <a class="linkbtn" href="create.html">+ Add a song</a>
      <button id="mode-chords" aria-pressed="false" title="Chord strumming practice: progression, strum pattern, diagrams">Chord practice</button>
      <label class="file" title="Play your own copy of the recording in sync (stays on your computer)">Load recording<input type="file" id="loadfile" accept="audio/*" hidden></label>
      <button id="more-rec" title="Hide the controls for screen recording (key H)">Hide controls (H)</button>
      <span class="legend" aria-label="Finger colours"><span><i style="background:#4cc9f0"></i>index</span><span><i style="background:#80ed99"></i>middle</span><span><i style="background:#ffd166"></i>ring</span><span><i style="background:#ef476f"></i>pinky</span><span><i style="background:#fff"></i>open</span></span>
      <div id="status" role="status"></div>
    </div>
  </div>
</div>
<div class="bar" id="bottom">
  <button id="play" aria-pressed="false">Play</button>
  <input id="scrub" type="range" min="0" max="1" step="0.01" value="0" aria-label="Position">
  <span id="time">0:00 / 0:00</span>
  <select id="rate" aria-label="Speed">
    <option value="1">1×</option><option value="0.75">0.75×</option><option value="0.5">0.5×</option><option value="0.25">0.25×</option>
  </select>
  <button id="loop" aria-pressed="false" title="Loop a passage: press at the start (A), again at the end (B), a third time to clear">Loop</button>
  <span id="learn-tools"></span>
</div>

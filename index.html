<style>
  :root {
    --ytpanel-bottom: 150px;
    --bg: #14161b; --panel: rgba(24, 27, 34, 0.88); --text: #e9ecf1; --muted: #9aa3b2;
    --accent: #ffb347; --border: rgba(255, 255, 255, 0.12); --btn: #2a2f3a; --btn-hover: #353b48;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --panel: rgba(250, 250, 252, 0.92); --text: #1b1f27; --muted: #5b6474;
      --border: rgba(0, 0, 0, 0.12); --btn: #e7e9ee; --btn-hover: #dcdfe6; --accent: #c76a00;
    }
  }
  :root[data-theme="dark"] { --panel: rgba(24, 27, 34, 0.88); --text: #e9ecf1; --muted: #9aa3b2; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .bar { position: fixed; left: 0; right: 0; padding: 8px 16px; display: flex; flex-wrap: wrap; gap: 8px;
    align-items: center; background: var(--panel); border-color: var(--border); backdrop-filter: blur(6px); }
  #top { top: 0; border-bottom: 1px solid var(--border); }
  #bottom { bottom: 0; border-top: 1px solid var(--border); padding-bottom: max(8px, env(safe-area-inset-bottom)); }
  h1 { font-size: 15px; margin: 0 8px 0 0; font-weight: 650; letter-spacing: 0.01em; }
  #status { color: var(--muted); font-size: 12px; }
  #info { font-variant-numeric: tabular-nums; font-size: 13px; min-height: 1.4em; flex: 1 1 100%; }
  button, select { font: inherit; color: var(--text); background: var(--btn); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 12px; min-height: 36px; cursor: pointer; }
  button:hover, select:hover { background: var(--btn-hover); }
  #play { min-width: 76px; font-weight: 600; border-color: var(--accent); }
  #scrub { flex: 1 1 160px; accent-color: var(--accent); min-width: 120px; }
  #time { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 84px; text-align: right; }
  label { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); }
  label.file { color: var(--text); background: var(--btn); border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; min-height: 36px; cursor: pointer; }
  label.file:hover { background: var(--btn-hover); }
  .linkbtn { color: var(--text); background: var(--btn); border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; min-height: 36px; display: inline-flex; align-items: center; text-decoration: none; }
  .linkbtn:hover { background: var(--btn-hover); }
  label.file:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
  .legend { display: inline-flex; gap: 10px; font-size: 12px; color: var(--muted); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }
  #loading { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); color: var(--muted); }
  @media (max-width: 600px) {
    h1 { flex: 1 1 100%; }
    .legend { display: none; }
    select { max-width: 100%; }
  }
</style>

<body>
<div id="stage"></div>
<div id="loading">Loading hand model…</div>
<div class="bar" id="top">
  <h1>Guitar Hand 3D</h1>
  <select id="song" aria-label="Song"></select>
  <a id="tabslink" class="linkbtn" href="tabs.html">Tab view</a>
  <a class="linkbtn" href="create.html">+ Add a song</a>
  <span id="status"></span>
  <span class="legend"><span><i style="background:#4cc9f0"></i>index</span><span><i style="background:#80ed99"></i>middle</span><span><i style="background:#ffd166"></i>ring</span><span><i style="background:#ef476f"></i>pinky</span><span><i style="background:#fff"></i>open</span></span>
</div>
<div class="bar" id="bottom">
  <div id="info">Press Play</div>
  <button id="play" aria-pressed="false">Play</button>
  <input id="scrub" type="range" min="0" max="1" step="0.01" value="0" aria-label="Position">
  <span id="time">0:00 / 0:00</span>
  <select id="rate" aria-label="Speed">
    <option value="1">1×</option><option value="0.75">0.75×</option><option value="0.5">0.5×</option><option value="0.25">0.25×</option>
  </select>
  <label><input type="checkbox" id="follow" checked> follow hand</label>
  <label class="file" title="Play your own copy of the recording in sync (stays on your computer)">Load recording<input type="file" id="loadfile" accept="audio/*" hidden></label>
  <button id="view-front">Front</button><button id="view-player">Player</button><button id="view-close">Close</button><button id="view-pick">Picking hand</button><button id="view-back">Back</button>
</div>
